general {
    lock_cmd = quickshell -c liquid-glass ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 dk hareketsizlikte kilitle (quickshell'deki otomatik-kilit anahtarı
# kapalıysa idleLock no-op'tur), 30 sn sonra ekranı kapat (anahtar kapalıysa
# o da atlanır; dosya yoksa açık varsayılır)
listener {
    timeout = 300
    on-timeout = quickshell -c liquid-glass ipc call lock idleLock
}

listener {
    timeout = 330
    on-timeout = sh -c 'test "$(cat {{HOME}}/.config/hypr/vars/autolock 2>/dev/null)" != off && hyprctl dispatch dpms off'
    on-resume = hyprctl dispatch dpms on
}
