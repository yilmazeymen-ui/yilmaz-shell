# ~/.config altından paylaşılacak dizinler
targets = [
    "hypr",
    "quickshell/liquid-glass",
    "kitty",
    "cava",
    "btop",
    "fish",
    "fastfetch",
]

# Dosya adı / yol kalıbı olarak dışlanacaklar
exclude_globs = [
    "*.bak",
    "*.save",
    "*.tmp",
    "*.swp",
    "*-DIR",
    ".git",
    ".git/**",
    ".vscode",
    ".vscode/**",
    "__pycache__",
    "palettes-backup",
    "palettes-backup/**",
]

# ~/.config göreli tam yol olarak dışlanacaklar
exclude_paths = [
    "hypr/scripts/audio-restore.sh",
    "hypr/vars/autolock",
    "fish/fish_variables",
]

# İlk kurulumda yüklenir; sistemde zaten varsa güncellemede korunur (--force ile ezilebilir)
preserve_if_exists = [
    "kitty/kitty.conf",
    "hypr/confs/keybindings.lua",
    "hypr/confs/keyboard.lua",
    "hypr/confs/monitor.lua",
    "hypr/confs/vars.lua",
    "hypr/confs/deco.lua",
    "hypr/confs/cursor.lua",
    "hypr/vars/bg",
    "fish/config.fish",
    "fastfetch/config.jsonc",
    "btop/btop.conf",
    "cava/config",
]

[wallpapers]
# Kaynak HOME altındaki duvar kağıdı klasörü
source = "Resimler/Arkaplan"
# Hedef XDG Pictures altındaki klasör adı
target_subdir = "Wallpapers"

[plugins.hyprglass]
repo = "https://github.com/hyprnux/hyprglass"
dest = ".local/share/hyprglass"
artifact = "hyprglass.so"

[packages]
pacman = [
    "hyprland",
    "quickshell",
    "kitty",
    "hyprpaper",
    "hypridle",
    "xdg-desktop-portal-hyprland",
    "polkit-kde-agent",
    "cliphist",
    "wl-clipboard",
    "hyprshot",
    "wireplumber",
    "pavucontrol",
    "cava",
    "btop",
    "fish",
    "fastfetch",
    "python-pillow",
    "python-pywal",
    "otf-geist-mono-nerd",
    "make",
    "gcc",
    "pkgconf",
]
aur = [
    "wayscriber-bin",
]

# Kurulum sonunda kontrol edilecek önerilen paket/komutlar
dependencies = [
    "Hyprland",
    "quickshell",
    "kitty",
    "hyprpaper",
    "hypridle",
    "cliphist",
    "wl-paste",
    "cava",
    "btop",
    "fish",
    "fastfetch",
]

[meta]
name = "hyprdots"
description = "Portable Hyprland, Quickshell (liquid-glass), Kitty, Cava, Btop, Fish & Fastfetch dotfiles"
